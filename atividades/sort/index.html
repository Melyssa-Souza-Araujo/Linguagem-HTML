<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizador de Algoritmos 2D Pro</title>
  
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --primary: #58a6ff;
      --accent: #ff9800;
      --success: #3fb950;
      --code-bg: #011627;
    }

    body {
      background-color: var(--bg-color);
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
      overflow-x: hidden;
    }

    h1 { color: #f0f6fc; margin-bottom: 5px; }

    .badges { display: flex; gap: 10px; margin-bottom: 20px; }
    .badge {
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: bold;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
    }
    .badge.time { color: var(--primary); border-color: var(--primary); }
    .badge.space { color: var(--success); border-color: var(--success); }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      align-items: center;
      background-color: var(--card-bg);
      padding: 15px 25px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
      max-width: 800px;
      width: 100%;
      box-sizing: border-box;
    }

    .control-group { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }

    select, input[type="number"], input[type="range"] {
      background-color: var(--bg-color);
      color: white;
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 6px;
      outline: none;
    }

    button {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      background-color: #238636;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover { background-color: #2ea043; }
    button:disabled { background-color: #343942; cursor: not-allowed; opacity: 0.6; }

    .stats-panel { display: flex; gap: 20px; margin-bottom: 15px; font-size: 0.95rem; }
    .stat-item span { color: var(--primary); font-weight: bold; }

    .status-text {
      height: 24px;
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent);
      margin-bottom: 15px;
    }

    .array-container {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 6px;
      height: 200px;
      width: 100%;
      max-width: 800px;
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      box-sizing: border-box;
      margin-bottom: 25px;
    }

    .bar {
      background-color: #2b3a4e;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.8rem;
      border-radius: 4px 4px 0 0;
      transition: height 0.1s ease, background-color 0.1s ease;
    }

    .bar.active { 
      background-color: var(--accent) !important; 
      box-shadow: 0 0 12px var(--accent);
    } 
    .bar.sorted { 
      background-color: var(--success) !important; 
      box-shadow: 0 0 8px var(--success);
    }

    .code-container {
      width: 100%;
      max-width: 800px;
      background-color: var(--code-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      font-family: monospace;
      box-sizing: border-box;
    }

    .code-line { padding: 2px 8px; border-radius: 4px; white-space: pre; color: #d6deeb; }
    .code-line.active {
      background-color: rgba(255, 152, 0, 0.25);
      border-left: 4px solid var(--accent);
      color: #ffffff;
      font-weight: bold;
    }

    /* Canvas para confete nativo */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <h1 id="algo-title">BUBBLE SORT</h1>
  
  <div class="badges">
    <div class="badge time" id="time-complexity">TIME: O(n²)</div>
    <div class="badge space" id="space-complexity">SPACE: O(1)</div>
  </div>

  <div class="controls">
    <div class="control-group">
      <label>Algoritmo:</label>
      <select id="algoSelect" onchange="changeAlgorithm()">
        <option value="bubble">Bubble Sort</option>
        <option value="selection">Selection Sort</option>
        <option value="insertion">Insertion Sort</option>
      </select>
    </div>

    <div class="control-group">
      <label>Colunas:</label>
      <input type="number" id="arraySize" value="10" min="5" max="30">
    </div>

    <div class="control-group">
      <label>Velocidade:</label>
      <input type="range" id="speedRange" min="10" max="500" value="200" style="direction: rtl">
    </div>

    <div class="control-group">
      <label><input type="checkbox" id="soundToggle" checked> Som</label>
    </div>

    <button id="btnGenerate" onclick="generateArray()">Gerar</button>
    <button id="btnSort" onclick="startSort()">Ordenar</button>
  </div>

  <div class="stats-panel">
    <div class="stat-item">Comparações: <span id="stat-comp">0</span></div>
    <div class="stat-item">Trocas: <span id="stat-swaps">0</span></div>
    <div class="stat-item">Tempo: <span id="stat-time">0.0s</span></div>
  </div>

  <div class="status-text" id="status">Aguardando início...</div>

  <div class="array-container" id="container"></div>

  <div class="code-container" id="code-block"></div>

  <script>
    const ALGORITHMS = {
      bubble: {
        title: "BUBBLE SORT", time: "TIME: O(n²)", space: "SPACE: O(1)",
        code: [
          "def bubble_sort(a):",
          "    n = len(a)",
          "    for p in range(n - 1):",
          "        for i in range(n - 1 - p):",
          "            if a[i] > a[i + 1]:",
          "                a[i], a[i + 1] = a[i + 1], a[i]",
          "    return a"
        ]
      },
      selection: {
        title: "SELECTION SORT", time: "TIME: O(n²)", space: "SPACE: O(1)",
        code: [
          "def selection_sort(a):",
          "    n = len(a)",
          "    for i in range(n):",
          "        min_idx = i",
          "        for j in range(i + 1, n):",
          "            if a[j] < a[min_idx]: min_idx = j",
          "        a[i], a[min_idx] = a[min_idx], a[i]"
        ]
      },
      insertion: {
        title: "INSERTION SORT", time: "TIME: O(n²)", space: "SPACE: O(1)",
        code: [
          "def insertion_sort(a):",
          "    for i in range(1, len(a)):",
          "        key = a[i]; j = i - 1",
          "        while j >= 0 and a[j] > key:",
          "            a[j + 1] = a[j]; j -= 1",
          "        a[j + 1] = key"
        ]
      }
    };

    let values = [], isSorting = false, comparisons = 0, swaps = 0;
    let startTime = 0, timerInterval = null, audioCtx = null;

    const container = document.getElementById('container');
    const statusText = document.getElementById('status');
    const inputSize = document.getElementById('arraySize');
    const speedRange = document.getElementById('speedRange');
    const btnGenerate = document.getElementById('btnGenerate');
    const btnSort = document.getElementById('btnSort');
    const codeBlock = document.getElementById('code-block');

    function playNote(freq) {
      if (!document.getElementById('soundToggle').checked) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } catch (e) {}
    }

    function changeAlgorithm() {
      if (isSorting) return;
      const key = document.getElementById('algoSelect').value;
      const algo = ALGORITHMS[key];
      document.getElementById('algo-title').innerText = algo.title;
      document.getElementById('time-complexity').innerText = algo.time;
      document.getElementById('space-complexity').innerText = algo.space;
      
      codeBlock.innerHTML = '';
      algo.code.forEach((line, index) => {
        const div = document.createElement('div');
        div.className = 'code-line';
        div.id = `line-${index}`;
        div.innerText = line;
        codeBlock.appendChild(div);
      });
    }

    function highlightCodeLine(lineIndex) {
      document.querySelectorAll('.code-line').forEach(el => el.classList.remove('active'));
      if (lineIndex !== null) {
        const target = document.getElementById(`line-${lineIndex}`);
        if (target) target.classList.add('active');
      }
    }

    function generateArray() {
      if (isSorting) return;
      const size = parseInt(inputSize.value) || 10;
      values = [];
      for (let i = 0; i < size; i++) values.push(Math.floor(Math.random() * 85) + 15);
      
      comparisons = 0; swaps = 0;
      updateStats();
      document.getElementById('stat-time').innerText = '0.0s';
      statusText.innerText = "Novo array gerado!";
      highlightCodeLine(null);
      render();
    }

    function render() {
      container.innerHTML = '';
      const barWidth = Math.max(12, Math.floor(600 / values.length) - 6);

      values.forEach(val => {
        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.height = `${val * 1.8}px`;
        bar.style.width = `${barWidth}px`;
        if (barWidth >= 22) bar.innerText = val;
        container.appendChild(bar);
      });
    }

    const sleep = () => new Promise(resolve => setTimeout(resolve, parseInt(speedRange.value)));

    function updateStats() {
      document.getElementById('stat-comp').innerText = comparisons;
      document.getElementById('stat-swaps').innerText = swaps;
    }

    function startTimer() {
      startTime = Date.now();
      timerInterval = setInterval(() => {
        document.getElementById('stat-time').innerText = ((Date.now() - startTime) / 1000).toFixed(1) + 's';
      }, 100);
    }

    function stopTimer() { clearInterval(timerInterval); }

    async function startSort() {
      if (isSorting || values.length === 0) return;
      isSorting = true;
      toggleButtons(true);
      startTimer();

      const algoKey = document.getElementById('algoSelect').value;
      if (algoKey === 'bubble') await runBubbleSort();
      else if (algoKey === 'selection') await runSelectionSort();
      else if (algoKey === 'insertion') await runInsertionSort();

      stopTimer();
      highlightCodeLine(null);
      statusText.innerText = "¡Ordenado!";
      launchConfetti();

      isSorting = false;
      toggleButtons(false);
    }

    async function runBubbleSort() {
      const bars = document.querySelectorAll('.bar');
      let n = values.length;
      for (let p = 0; p < n - 1; p++) {
        highlightCodeLine(2);
        for (let i = 0; i < n - 1 - p; i++) {
          highlightCodeLine(3);
          bars[i].classList.add('active');
          bars[i + 1].classList.add('active');
          
          playNote(200 + values[i] * 5);
          comparisons++; updateStats();
          await sleep();

          highlightCodeLine(4);
          if (values[i] > values[i + 1]) {
            highlightCodeLine(5);
            [values[i], values[i + 1]] = [values[i + 1], values[i]];
            swaps++; updateStats();

            bars[i].style.height = `${values[i] * 1.8}px`;
            bars[i + 1].style.height = `${values[i + 1] * 1.8}px`;
            if (bars[i].innerText) {
              bars[i].innerText = values[i];
              bars[i + 1].innerText = values[i + 1];
            }
            await sleep();
          }
          bars[i].classList.remove('active');
          bars[i + 1].classList.remove('active');
        }
        bars[n - 1 - p].classList.add('sorted');
      }
      bars[0].classList.add('sorted');
    }

    async function runSelectionSort() {
      const bars = document.querySelectorAll('.bar');
      let n = values.length;
      for (let i = 0; i < n; i++) {
        highlightCodeLine(2);
        let minIdx = i;
        bars[minIdx].classList.add('active');

        for (let j = i + 1; j < n; j++) {
          highlightCodeLine(4);
          bars[j].classList.add('active');
          comparisons++; updateStats();
          playNote(200 + values[j] * 5);
          await sleep();

          if (values[j] < values[minIdx]) {
            bars[minIdx].classList.remove('active');
            minIdx = j;
            bars[minIdx].classList.add('active');
          } else {
            bars[j].classList.remove('active');
          }
        }

        if (minIdx !== i) {
          highlightCodeLine(6);
          [values[i], values[minIdx]] = [values[minIdx], values[i]];
          swaps++; updateStats();
          bars[i].style.height = `${values[i] * 1.8}px`;
          bars[minIdx].style.height = `${values[minIdx] * 1.8}px`;
          if (bars[i].innerText) {
            bars[i].innerText = values[i];
            bars[minIdx].innerText = values[minIdx];
          }
          await sleep();
        }
        bars[minIdx].classList.remove('active');
        bars[i].classList.remove('active');
        bars[i].classList.add('sorted');
      }
    }

    async function runInsertionSort() {
      const bars = document.querySelectorAll('.bar');
      let n = values.length;
      bars[0].classList.add('sorted');

      for (let i = 1; i < n; i++) {
        highlightCodeLine(1);
        let key = values[i], j = i - 1;
        bars[i].classList.add('active');
        await sleep();

        while (j >= 0 && values[j] > key) {
          highlightCodeLine(3);
          comparisons++; swaps++; updateStats();
          playNote(200 + values[j] * 5);

          values[j + 1] = values[j];
          bars[j + 1].style.height = `${values[j] * 1.8}px`;
          if (bars[j + 1].innerText) bars[j + 1].innerText = values[j];
          j--;
          await sleep();
        }
        values[j + 1] = key;
        bars[j + 1].style.height = `${key * 1.8}px`;
        if (bars[j + 1].innerText) bars[j + 1].innerText = key;

        bars[i].classList.remove('active');
        for (let k = 0; k <= i; k++) bars[k].classList.add('sorted');
      }
    }

    function toggleButtons(disabled) {
      btnGenerate.disabled = disabled;
      btnSort.disabled = disabled;
      inputSize.disabled = disabled;
      document.getElementById('algoSelect').disabled = disabled;
    }

    // --- Confete Nativo em Canvas ---
    function launchConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#58a6ff', '#ff9800', '#3fb950', '#f0f6fc', '#e36049'];

      for (let i = 0; i < 80; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 12,
          vy: (Math.random() - 0.7) * 12,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: Math.random() * 8 + 4
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;

        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.2; // Gravidade

          if (p.y < canvas.height) {
            active = true;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
          }
        });

        if (active) requestAnimationFrame(animate);
      }
      animate();
    }

    // Inicialização
    changeAlgorithm();
    generateArray();
  </script>
</body>
</html>

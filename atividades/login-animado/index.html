<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Animado</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #e8ece9;
            padding: 20px;
        }

        .wrapper {
            position: relative;
            width: 800px;
            max-width: 100%;
            min-height: 500px;
            background: linear-gradient(135deg, #4d7c0f, #84cc16);
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            padding: 40px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            overflow: hidden;
        }

        /* Imagem de fundo ajustada */
        .wrapper img {
            position: absolute;
            right: -30px;
            bottom: -50px;
            width: 350px;
            pointer-events: none;
            opacity: 0.6;
            z-index: 1;
        }

        /* Formulários */
        .form-wrapper {
            z-index: 2;
            width: 100%;
            max-width: 340px;
            transition: all 0.6s ease-in-out;
        }

        .form-wrapper.login {
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
        }

        .wrapper.active .form-wrapper.login {
            opacity: 0;
            visibility: hidden;
            transform: translateX(-100%);
            position: absolute;
        }

        .form-wrapper.register {
            position: absolute;
            opacity: 0;
            visibility: hidden;
            transform: translateX(100%);
        }

        .wrapper.active .form-wrapper.register {
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
            position: relative;
        }

        h2 {
            font-size: 2em;
            text-align: center;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .input-box {
            position: relative;
            width: 100%;
            margin: 20px 0;
        }

        .input-box input {
            width: 100%;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #ffffff;
            outline: none;
            border-radius: 40px;
            font-size: 1em;
            color: #ffffff;
            padding: 0 20px 0 45px;
        }

        .input-box input::placeholder {
            color: rgba(255, 255, 255, 0.8);
        }

        .input-box .icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #ffffff;
            font-size: 1.2em;
            display: flex;
            align-items: center;
        }

        .forgot-pass {
            margin: -10px 0 15px 15px;
        }

        .forgot-pass a {
            color: #ffffff;
            font-size: 0.9em;
            text-decoration: none;
        }

        .forgot-pass a:hover {
            text-decoration: underline;
        }

        button {
            width: 100%;
            height: 45px;
            background: #ffffff;
            border: none;
            outline: none;
            border-radius: 40px;
            cursor: pointer;
            font-size: 1em;
            color: #3f6212;
            font-weight: 600;
            transition: 0.3s;
        }

        button:hover {
            background: #f0fdf4;
            transform: translateY(-2px);
        }

        .sign-link {
            font-size: 0.9em;
            text-align: center;
            margin-top: 20px;
        }

        .sign-link p {
            color: #ffffff;
        }

        .sign-link p a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            margin-left: 5px;
        }

        .sign-link p a:hover {
            text-decoration: underline;
        }

        /* Ajustes de Responsividade (Celulares e Tablets) */
        @media (max-width: 768px) {
            .wrapper {
                padding: 30px 20px;
                justify-content: center;
                min-height: auto;
            }

            .wrapper img {
                width: 250px;
                right: -50px;
                bottom: -50px;
            }

            .form-wrapper {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <img src="img.png" alt="Planta Decorativa">

        <!-- Formulário de Login -->
        <div class="form-wrapper login">
            <form action="#">
                <h2>Conecte-se</h2>
                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="mail-outline"></ion-icon>
                    </span>
                    <input type="email" placeholder="E-mail" required>
                </div>
                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="lock-closed-outline"></ion-icon>
                    </span>
                    <input type="password" placeholder="Senha" required>
                </div>
                <div class="forgot-pass">
                    <a href="#">Esqueceu sua senha?</a>
                </div>
                <button type="submit">Conecte-se</button>
                <div class="sign-link">
                    <p>Não tem uma conta?<a href="#" onclick="registerActive(event)">Cadastre-se</a></p>
                </div>
            </form>
        </div>

        <!-- Formulário de Cadastro -->
        <div class="form-wrapper register">
            <form action="#">
                <h2>Inscrição</h2>
                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="person-outline"></ion-icon>
                    </span>
                    <input type="text" placeholder="Nome completo" required>
                </div>
                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="mail-outline"></ion-icon>
                    </span>
                    <input type="email" placeholder="E-mail" required>
                </div>
                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="lock-closed-outline"></ion-icon>
                    </span>
                    <input type="password" placeholder="Senha" required>
                </div>
                <button type="submit">Cadastre-se</button>
                <div class="sign-link">
                    <p>Já tem uma conta?<a href="#" onclick="loginActive(event)">Iniciar sessão</a></p>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
    <script>
        const wrapper = document.querySelector('.wrapper');
        
        function registerActive(e) {
            e.preventDefault();
            wrapper.classList.add('active');
        }
        
        function loginActive(e) {
            e.preventDefault();
            wrapper.classList.remove('active');
        }
    </script>
</body>
</html>
